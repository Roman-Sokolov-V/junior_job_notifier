services:
  db:
    image: pgvector/pgvector:0.8.5-pg17-bookworm
    environment:
      POSTGRES_USER: scraper
      POSTGRES_PASSWORD: scraper
      POSTGRES_DB: vacancies
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scraper -d vacancies"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql://scraper:scraper@db:5432/vacancies
    depends_on:
      db:
        condition: service_healthy
    command: ["uv", "run", "alembic", "upgrade", "head"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
#    volumes:
#      - .:/app
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env.docker
    command: ["uv", "run", "run.py"]

volumes:
  pgdata:

networks:
  app_net: